name = "crypto1-backend"
main = "worker/index.js"
compatibility_date = "2026-10-30"
workers_dev = true

[vars]
ENVIRONMENT = "development"
ALLOW_DEV_OTP = "true"

[[d1_databases]]
binding = "DB"
database_name = "crypto1-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"
